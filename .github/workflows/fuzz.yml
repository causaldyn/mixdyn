name: fuzz

# Coverage-guided fuzzing, atheris over libFuzzer, of the three places whose contracts can be stated
# for every input: reading a long table into a panel, planning a budget in a box, and reading a
# saved document or file. Five minutes a target on every change, half an hour a week; a crash fails
# the job and uploads the input that caused it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    # The private copy of the tree would spend its minutes on the weekly run: public alone, as
    # codeql.yml.
    if: github.repository == 'causaldyn/mixdyn'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [documents, plan, read]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          # atheris 3.1.0 ships wheels for 3.12 to 3.14 only
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Fuzz
        # atheris is hash-pinned in fuzz/requirements.txt rather than locked: nothing that installs
        # the package needs it
        run: |
          mkdir -p crashes
          uv run --with-requirements fuzz/requirements.txt python fuzz/fuzz_${{ matrix.target }}.py \
            -max_total_time=${{ github.event_name == 'schedule' && 1800 || 300 }} \
            -max_len=1024 -len_control=0 -artifact_prefix=crashes/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: crashes-${{ matrix.target }}
          path: crashes/
