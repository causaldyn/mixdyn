site_name: mixdyn
site_url: https://causaldyn.github.io/mixdyn/
site_description: >-
  Media-mix modelling engine: dynamic linear models, geo hierarchies and budget plans.
repo_url: https://github.com/causaldyn/mixdyn

theme:
  name: material
  font: false  # system fonts, so a page view sends no request to Google Fonts
  features:
    - content.code.copy
    - navigation.indexes

# Not pages. The ADRs and the release check are records for whoever changes the engine, and they
# cite the repository's own paths (evidence/, scripts/, tests/), which the site does not hold: the
# site links them on GitHub, where each path is one click away.
exclude_docs: |
  adr/
  release-check.md

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  # The home page and the walkthrough are the README's and SKILL.md's own sections, included
  # between their `--8<--` markers, so the site and the files GitHub shows cannot drift apart.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # mixdyn.decisions lists three classes of chc.allocation, which the pages render from
            # chc's own docstrings.
            preload_modules: [chc]
            docstring_style: google
            # Every name an `__all__` lists is public, documented yet or not, so each gets an entry.
            # The filter keeps out what that would add besides: `__all__` itself, and the
            # dataclasses' generated `__init__` and their `__post_init__` checks, none of which has
            # a docstring; the merge puts each class's `__init__` signature on its heading.
            show_if_no_docstring: true
            filters: ["!^_"]
            merge_init_into_class: true
            show_source: false
            show_root_heading: false
            heading_level: 2
            members_order: source

nav:
  - Home: index.md
  - Walkthrough: walkthrough.md
  - Scope: scope.md
  - API reference:
      - api/index.md
      - api/api.md
      - api/api/serialize.md
      - api/calibration.md
      - api/data.md
      - api/data/feedback.md
      - api/decisions.md
      - api/experiments.md
      - api/inference.md
      - api/inference/sensitivity.md
      - api/models.md
      - api/models/demand.md
      - api/transforms.md
