<svg xmlns="http://www.w3.org/2000/svg" width="1014" height="312" viewBox="0 0 1014 312" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">The README's first plan, drawn</title>
<desc id="desc">Three channels' margins as fitted on two simulated years of weekly history, with their 95 % intervals, against the margins the history was drawn with; and next quarter's weekly plan against the status quo, inside half to twice each channel's status quo.</desc>
<rect x="0.5" y="0.5" width="1013" height="311" rx="10" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.1"/>
<text x="24.0" y="40.0" font-size="17" fill="#f0efec" font-weight="600">The first plan, drawn</text>
<text x="24.0" y="64.0" font-size="12.5" fill="#c3c2b7">The example above, on two simulated years of weekly history: each channel’s margin as fitted, against the margin the history was drawn with,</text>
<text x="24.0" y="81.0" font-size="12.5" fill="#c3c2b7">and next quarter’s weekly spend at the same budget, filled along each channel’s curve from its shrunk margin, inside half to twice the status quo.</text>
<text x="118.0" y="128.0" font-size="13" fill="#f0efec" font-weight="600">Margin: sales a unit of weekly spend returns</text>
<text x="526.0" y="128.0" font-size="13" fill="#f0efec" font-weight="600">Weekly spend, next quarter</text>
